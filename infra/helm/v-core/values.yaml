replicaCount: 1

image:
  repository: ghcr.io/example/v-core-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

existingSecret: v-core-backend

config:
  deploymentEnvironment: kubernetes
  otelExporterEnabled: "false"
  otelTracesSamplerProbability: "0.1"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
