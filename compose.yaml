name: v-core

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vcore
      POSTGRES_USER: vcore
      POSTGRES_PASSWORD: vcore
    ports:
      - "${VCORE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcore -d vcore"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${VCORE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vcore
      SPRING_DATASOURCE_USERNAME: vcore
      SPRING_DATASOURCE_PASSWORD: vcore
      SPRING_DATA_REDIS_URL: redis://redis:6379
      VCORE_BFF_SHARED_SECRET: local-development-only
      SPRINGDOC_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
